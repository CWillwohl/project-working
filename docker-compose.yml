name: working

services:
  app:
    build:
      context: .
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    ports:
      - ${APP_PORT:-8000}:80
    volumes:
      - .:/var/www/html
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      IGNITION_LOCAL_SITES_PATH: ${PWD}
      IGNITION_REMOTE_SITES_PATH: /var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      vite:
        condition: service_started
      mailpit:
        condition: service_started

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    # Run the Vite binary directly so it receives SIGTERM and removes public/hot on shutdown
    command: sh -c "npm ci && exec node_modules/.bin/vite"
    environment:
      HUSKY: 0
      VITE_PORT: ${VITE_PORT:-5173}
      npm_config_cache: /tmp/.npm
    ports:
      - ${VITE_PORT:-5173}:${VITE_PORT:-5173}
    volumes:
      - .:/var/www/html

  mysql:
    image: mysql:8.4
    ports:
      - ${FORWARD_DB_PORT:-3306}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env (cp .env.dev .env)}
      MYSQL_DATABASE: ${DB_DATABASE:?Defina DB_DATABASE no .env (cp .env.dev .env)}
      MYSQL_USER: ${DB_USERNAME:?Defina DB_USERNAME no .env (cp .env.dev .env)}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh:ro
    healthcheck:
      # Check over TCP so the temporary server MySQL runs without networking
      # while initializing the volume is not reported as healthy
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - ${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025

volumes:
  mysql-data:
